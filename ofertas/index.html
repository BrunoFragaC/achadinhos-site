<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Vitrine "Achados do dia": os melhores itens postados no dia, com o link de AFILIADO.
       Os produtos moram em ofertas.json (mesma pasta) — editar só lá, este HTML não muda.
       Sem pixel de propósito (regra "uma LP, um pixel"): tráfego orgânico fora das campanhas. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e56a9e" />
  <meta name="description" content="Os melhores achadinhos do dia da Achadinhos da Jô: ofertas e cupons selecionados, num clique." />
  <meta property="og:title" content="Achados do dia — Achadinhos da Jô" />
  <meta property="og:description" content="As melhores ofertas de hoje, selecionadas pela Jô." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://achadinhosdajo10.com.br/jo-hero.jpg" />
  <title>Achados do Dia — Achadinhos da Jô</title>
  <link rel="icon" type="image/png" href="../logo.png" />
  <link rel="apple-touch-icon" href="../logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }

    :root{
      --rose:#ec4f98;
      --lilac:#a569e0;
      --plum:#3d1633;
      --muted:#7a5a70;
      --gold:#ffd166;
      --verde:#1fbf5c;
    }

    body{
      font-family:'Poppins',system-ui,-apple-system,sans-serif;
      color:var(--plum);
      -webkit-font-smoothing:antialiased;
      background:#fbe6f1;
    }

    .stage{
      min-height:100vh;overflow-x:hidden;
      display:flex;justify-content:center;
      padding:18px 16px 40px;
      background:
        radial-gradient(60% 40% at 90% 8%, #ffc9e3 0%, transparent 70%),
        radial-gradient(60% 40% at 0% 45%, #ead7fb 0%, transparent 70%),
        linear-gradient(180deg,#fdf0f7,#fbe3f0 50%,#f6e6fb);
    }
    .wrap{ width:100%;max-width:560px; }

    /* ---- topo ---- */
    .topo{ display:flex;align-items:center;gap:14px;margin-top:4px; }
    .topo img{
      width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:60% 20%;
      border:3px solid #fff;box-shadow:0 8px 18px -8px rgba(0,0,0,.35);flex:0 0 auto;
    }
    .titulo{
      font-family:'Kaushan Script',cursive;font-weight:400;
      font-size:clamp(34px,10vw,44px);line-height:1;
      text-shadow:0 2px 0 #fff;
    }
    .titulo span{ color:var(--rose); }
    .data{ font-size:13px;font-weight:600;color:var(--muted);margin-top:4px; }

    .aviso{
      margin:16px 0 18px;
      background:linear-gradient(90deg,var(--rose),var(--lilac));
      color:#fff;border-radius:16px;padding:10px 14px;
      font-size:13px;font-weight:600;line-height:1.4;text-align:center;
      box-shadow:0 10px 24px -14px rgba(165,105,224,.8);
    }
    .aviso b{ color:var(--gold); }

    /* ---- lista de ofertas (empilhada) ---- */
    .lista{ display:flex;flex-direction:column;gap:12px; }
    .oferta{
      display:flex;gap:12px;align-items:stretch;
      background:#fff;border-radius:20px;padding:12px;
      text-decoration:none;color:inherit;
      border:2px solid rgba(255,255,255,.9);
      box-shadow:0 14px 28px -18px rgba(61,22,51,.45);
      transition:transform .15s ease;
    }
    .oferta:active{ transform:scale(.985); }
    .oferta:focus-visible{ outline:3px solid var(--plum);outline-offset:3px; }

    .foto{
      flex:0 0 auto;width:104px;height:104px;border-radius:14px;
      object-fit:contain;background:#fff;
    }
    .info{ flex:1 1 auto;min-width:0;display:flex;flex-direction:column; }
    .nome{
      font-size:14px;font-weight:600;line-height:1.35;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .precos{ margin-top:6px;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px; }
    .antigo{ font-size:12.5px;color:var(--muted);text-decoration:line-through; }
    .preco{ font-size:20px;font-weight:800;color:var(--plum);letter-spacing:-.01em; }
    .desc{ font-size:12px;font-weight:700;color:var(--verde); }
    .cupom{
      align-self:flex-start;margin-top:6px;
      font-size:11.5px;font-weight:700;
      background:#fff3d1;color:#8a5a00;border:1.5px dashed #e3b13f;
      border-radius:8px;padding:3px 8px;
    }
    .rodape{ margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px; }
    .loja{ font-size:11.5px;font-weight:600;color:var(--muted); }
    .ver{
      flex:0 0 auto;
      background:linear-gradient(180deg,#ff5fa6,#e83486);color:#fff;
      font-size:13px;font-weight:700;border-radius:999px;padding:7px 14px;
      box-shadow:0 8px 16px -10px rgba(232,52,134,.9);
    }

    .vazio{
      background:#fff;border-radius:20px;padding:28px 18px;text-align:center;
      font-size:14.5px;line-height:1.5;color:var(--muted);
    }
    .vazio b{ color:var(--plum); }

    /* ---- chamada pro grupo ---- */
    .grupo{
      display:flex;align-items:center;justify-content:center;gap:10px;
      margin-top:22px;text-decoration:none;
      background:linear-gradient(135deg,#3be07a,#1fbf5c);color:#fff;
      border-radius:999px;padding:14px 18px;
      font-size:15px;font-weight:800;
      box-shadow:0 16px 30px -14px rgba(30,190,91,.75);
    }
    .grupo svg{ width:24px;height:24px;fill:currentColor;flex:0 0 auto; }
    .nota{ font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5; }

    @media (max-width:380px){
      .foto{ width:86px;height:86px; }
      .preco{ font-size:18px; }
      .ver{ padding:6px 11px;font-size:12px; }
    }
    @media (prefers-reduced-motion:reduce){ .oferta{ transition:none; } }
  </style>
</head>
<body>

  <div class="stage">
    <main class="wrap">

      <header class="topo">
        <img src="../links/jo-links.jpg" width="72" height="72" alt="Jô, da Achadinhos da Jô" />
        <div>
          <h1 class="titulo">Achados <span>do dia</span></h1>
          <p class="data" id="data"></p>
        </div>
      </header>

      <p class="aviso">Os melhores achadinhos de hoje, <b>selecionados pela Jô</b>. Preço e cupom podem mudar a qualquer momento! ⏰</p>

      <section class="lista" id="lista" aria-live="polite">
        <p class="vazio">Carregando as ofertas…</p>
      </section>

      <a class="grupo" href="../links/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.003 3C9.374 3 4 8.373 4 14.999c0 2.394.703 4.625 1.913 6.5L4 29l7.69-1.882a11.94 11.94 0 0 0 4.313.797h.005C22.626 27.915 28 22.541 28 15.915 28 12.7 26.747 9.68 24.477 7.41 22.207 5.14 19.187 3 16.003 3zm5.46 14.349c-.299-.15-1.77-.873-2.045-.973-.274-.1-.474-.15-.673.15-.2.3-.773.973-.948 1.173-.175.2-.349.225-.648.075-.299-.15-1.265-.466-2.408-1.486-.89-.794-1.49-1.774-1.665-2.074-.175-.299-.019-.461.131-.611.135-.135.299-.349.449-.524.15-.175.2-.3.299-.499.1-.2.05-.374-.025-.524-.075-.15-.673-1.624-.923-2.225-.243-.583-.49-.504-.673-.513l-.574-.01c-.2 0-.524.075-.799.374-.274.3-1.047 1.023-1.047 2.494 0 1.47 1.072 2.892 1.222 3.092.15.2 2.109 3.222 5.111 4.516.715.309 1.272.493 1.706.631.717.228 1.369.196 1.884.119.575-.086 1.77-.722 2.02-1.421.249-.7.249-1.299.174-1.423-.075-.124-.274-.2-.573-.349z"/></svg>
        Quero receber no WhatsApp
      </a>

      <p class="nota">Links de afiliado: comprando por eles você paga o mesmo preço e ajuda a Achadinhos da Jô a continuar. 💖</p>

    </main>
  </div>

  <script>
    // Só aceita link http(s) — um texto errado no JSON não vira link quebrado/perigoso.
    function linkSeguro(u){
      try{ const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; }catch(e){ return ''; }
    }
    function el(tag, cls, texto){
      const e = document.createElement(tag);
      if(cls) e.className = cls;
      if(texto != null) e.textContent = texto;
      return e;
    }
    // "189,90" ou 189.9 → número, pra calcular o % de desconto
    function num(v){
      if(typeof v === 'number') return v;
      const s = String(v || '').replace(/[^\d,.]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');
      return parseFloat(s);
    }
    function reais(v){
      const n = num(v);
      return isNaN(n) ? String(v) : n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    }

    function montar(o){
      const link = linkSeguro(o.link);
      if(!link || !o.titulo) return null;

      const a = el('a','oferta');
      a.href = link;
      a.target = '_blank';
      a.rel = 'noopener sponsored';

      const foto = linkSeguro(o.foto);
      if(foto){
        const img = el('img','foto');
        img.src = foto; img.alt = ''; img.loading = 'lazy';
        img.width = 104; img.height = 104;
        img.referrerPolicy = 'no-referrer';
        a.appendChild(img);
      }

      const info = el('div','info');
      info.appendChild(el('span','nome',o.titulo));

      const precos = el('div','precos');
      if(o.precoAntigo) precos.appendChild(el('span','antigo',reais(o.precoAntigo)));
      if(o.preco) precos.appendChild(el('span','preco',reais(o.preco)));
      const p = num(o.preco), pa = num(o.precoAntigo);
      if(p > 0 && pa > p) precos.appendChild(el('span','desc',Math.round((1 - p/pa)*100) + '% OFF'));
      info.appendChild(precos);

      if(o.cupom) info.appendChild(el('span','cupom','🎟️ ' + o.cupom));

      const rod = el('div','rodape');
      rod.appendChild(el('span','loja',o.loja || 'Mercado Livre'));
      rod.appendChild(el('span','ver','Ver oferta ›'));
      info.appendChild(rod);

      a.appendChild(info);
      return a;
    }

    const lista = document.getElementById('lista');
    // cache-buster: o GitHub Pages guarda o JSON ~10 min; assim a oferta nova aparece na hora
    fetch('ofertas.json?v=' + Date.now(), {cache:'no-store'})
      .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => {
        if(d.atualizado) document.getElementById('data').textContent = 'Atualizado em ' + d.atualizado;
        const cards = (d.ofertas || []).map(montar).filter(Boolean);
        lista.textContent = '';
        if(!cards.length){
          const v = el('p','vazio');
          v.innerHTML = '<b>Os achados de hoje já já chegam!</b><br>Enquanto isso, entra no grupo e recebe tudo primeiro no WhatsApp. 👇';
          lista.appendChild(v);
          return;
        }
        cards.forEach(c => lista.appendChild(c));
      })
      .catch(() => {
        lista.textContent = '';
        lista.appendChild(el('p','vazio','Não consegui carregar as ofertas agora. Atualize a página daqui a pouco.'));
      });
  </script>

</body>
</html>
